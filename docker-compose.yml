name: pokebatalha

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 3s
      timeout: 3s
      retries: 20

  catalogo:
    build:
      context: .
      args:
        SERVICO: catalogo
    environment:
      PORTA_HTTP: "8080"
      PORTA_GRPC: "9090"
      DATABASE_URL: postgres://catalogo:catalogo@postgres:5432/catalogo_db?sslmode=disable
      POKEAPI_URL: https://pokeapi.co/api/v2
      POKEAPI_TIMEOUT: 5s
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  jogadores:
    build:
      context: .
      args:
        SERVICO: jogadores
    environment:
      PORTA_HTTP: "8080"
      PORTA_GRPC: "9090"
      DATABASE_URL: postgres://jogadores:jogadores@postgres:5432/jogadores_db?sslmode=disable
      CATALOGO_GRPC_ADDR: catalogo:9090
      MOEDAS_INICIAIS: "100"
      PRECO_PACOTE: "30"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalogo:
        condition: service_started
    restart: unless-stopped

  batalha:
    build:
      context: .
      args:
        SERVICO: batalha
    environment:
      PORTA_HTTP: "8080"
      DATABASE_URL: postgres://batalha:batalha@postgres:5432/batalha_db?sslmode=disable
      CATALOGO_GRPC_ADDR: catalogo:9090
      JOGADORES_GRPC_ADDR: jogadores:9090
      RECOMPENSA_VITORIA: "50"
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      catalogo:
        condition: service_started
      jogadores:
        condition: service_started
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - catalogo
      - jogadores
      - batalha
    restart: unless-stopped

volumes:
  dados-postgres:
