syntax = "proto3";

package jogadores.v1;

option go_package = "pokebatalha/gen/jogadores/v1;jogadoresv1";

// dono das contas, do saldo de moedas e da coleção.
service Jogadores {
  // confere se o jogador tem todos os Pokémon do time.
  // erros: NOT_FOUND (jogador), FAILED_PRECONDITION (falta algum Pokémon).
  rpc ValidarTime(ValidarTimeRequest) returns (ValidarTimeResponse);

  // soma a recompensa de batalha ao saldo.
  rpc CreditarMoedas(CreditarMoedasRequest) returns (CreditarMoedasResponse);
}

message ValidarTimeRequest {
  int64 jogador_id = 1;
  repeated int32 pokemon_ids = 2;
}

message ValidarTimeResponse {}

message CreditarMoedasRequest {
  int64 jogador_id = 1;
  int32 quantidade = 2;
}

message CreditarMoedasResponse {
  int32 saldo = 1;
}
