server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS do Docker: com o nome numa variável, o IP é resolvido a cada 10s
    # e o proxy não dá 502 quando um container é recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # compressão
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # pacote com o catálogo frio pode demorar.
    proxy_read_timeout 90s;
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # proxy reverso para as APIs (mesma origem: sem CORS)
    location /api/jogadores/ {
        set $jogadores http://jogadores:8080;
        rewrite ^/api/jogadores/(.*)$ /$1 break;
        proxy_pass $jogadores;
    }
    location /api/batalha/ {
        set $batalha http://batalha:8080;
        rewrite ^/api/batalha/(.*)$ /$1 break;
        proxy_pass $batalha;
    }
    location /api/catalogo/ {
        set $catalogo http://catalogo:8080;
        rewrite ^/api/catalogo/(.*)$ /$1 break;
        proxy_pass $catalogo;
    }

    # não deixa baixar este arquivo.
    location = /nginx.conf { return 404; }

    # js/css/html: o navegador sempre revalida (ETag) para não usar versão velha.
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    # imagens mudam pouco.
    location ~* \.(?:png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # fallback da SPA (as telas usam #hash, mas por garantia)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
