server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o nome do serviço numa variável, o NGINX
    # resolve o IP a cada 10s em vez de só ao ligar: se um container do
    # back-end for recriado (ex: docker compose up --build), o proxy continua
    # funcionando em vez de dar 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compressão
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Abrir pacote com o catálogo ainda frio pode demorar.
    proxy_read_timeout 90s;
    proxy_connect_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # ----- Proxy reverso para as APIs (mesma origem: sem CORS) -----
    location /api/jogadores/ {
        set $jogadores http://jogadores:8080;
        rewrite ^/api/jogadores/(.*)$ /$1 break;
        proxy_pass $jogadores;
    }
    location /api/batalha/ {
        set $batalha http://batalha:8080;
        rewrite ^/api/batalha/(.*)$ /$1 break;
        proxy_pass $batalha;
    }
    location /api/catalogo/ {
        set $catalogo http://catalogo:8080;
        rewrite ^/api/catalogo/(.*)$ /$1 break;
        proxy_pass $catalogo;
    }

    # Este arquivo fica dentro da pasta servida: não deixa baixar.
    location = /nginx.conf { return 404; }

    # JS/CSS/HTML: o navegador sempre confere se mudou (ETag), para nunca
    # ficar preso numa versão antiga depois de atualizar os arquivos.
    location ~* \.(?:js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    # Imagens e ícones mudam pouco.
    location ~* \.(?:png|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Fallback da SPA (as telas usam #hash, mas por garantia)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
